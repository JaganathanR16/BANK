<!-- templates/index.html -->

<!DOCTYPE html>
<html>

<head>

    <title>Interest Calculator</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow p-4">

        <!-- TITLE -->
        <h2 class="text-center text-primary mb-4">
            Interest Calculator
        </h2>

        <!-- FORM -->
        <form method="POST">

            <!-- TOP SECTION -->
            <div class="row">

                <!-- PRINCIPAL -->
                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Principal Amount
                    </label>

                    <input
                        type="text"
                        name="principal"
                        class="form-control"
                        value="{{ principal }}"
                        required
                    >

                </div>

                <!-- LOAN FROM -->
                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Loan From Date
                    </label>

                    <input
                        type="date"
                        name="loan_from"
                        class="form-control"
                        value="{{ loan_from }}"
                        required
                    >

                </div>

                <!-- LOAN TO -->
                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Loan To Date
                    </label>

                    <input
                        type="date"
                        name="loan_to"
                        class="form-control"
                        value="{{ loan_to }}"
                        required
                    >

                </div>

            </div>

            <hr>

            <!-- INTEREST SET TITLE -->
            <h4 class="text-success mb-3">
                Interest Rate Sets
            </h4>

            <!-- INTEREST ROWS -->
            <div id="interestRows">

            {% if from_dates %}

                {% for i in range(from_dates|length) %}

                <div class="row mb-3 align-items-center interest-row">

                    <!-- FROM DATE -->
                    <div class="col-md-3">

                        <input
                            type="date"
                            name="from_date[]"
                            class="form-control"
                            value="{{ from_dates[i] }}"
                        >

                    </div>

                    <!-- TO DATE -->
                    <div class="col-md-3">

                        <input
                            type="date"
                            name="to_date[]"
                            class="form-control"
                            value="{{ to_dates[i] }}"
                        >

                    </div>

                    <!-- RATE -->
                    <div class="col-md-3">

                        <input
                            type="text"
                            name="rate[]"
                            placeholder="Rate %"
                            class="form-control"
                            value="{{ rates[i] }}"
                        >

                    </div>

                    <!-- DELETE -->
                    <div class="col-md-2">

                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="deleteRow(this)"
                        >
                            🗑 Delete
                        </button>

                    </div>

                </div>

                {% endfor %}

            {% else %}

                <!-- DEFAULT ROW -->
                <div class="row mb-3 align-items-center interest-row">

                    <div class="col-md-3">

                        <input
                            type="date"
                            name="from_date[]"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-3">

                        <input
                            type="date"
                            name="to_date[]"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-3">

                        <input
                            type="text"
                            name="rate[]"
                            placeholder="Rate %"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-2">

                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="deleteRow(this)"
                        >
                            🗑 Delete
                        </button>

                    </div>

                </div>

            {% endif %}

            </div>

            <!-- BUTTONS -->
            <div class="mt-3">

                <!-- ADD -->
                <button
                    type="button"
                    class="btn btn-info"
                    onclick="addRow()"
                >
                    Add Interest Set
                </button>

                <!-- CALCULATE -->
                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Calculate Interest
                </button>

                <!-- CANCEL -->
                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cancelApplication()"
                >
                    Cancel
                </button>

                <!-- DOWNLOAD PDF -->
                <a
                    href="/download_pdf"
                    class="btn btn-warning"
                >
                    Download PDF
                </a>

            </div>

        </form>

        <hr>

        <!-- RESULT -->
        <h4 class="text-primary">
            Result
        </h4>

        <textarea
            class="form-control"
            rows="25"
        >{{ result }}</textarea>

    </div>

</div>


<!-- JAVASCRIPT -->
<script>

// ADD ROW
function addRow() {

    let row = `
    <div class="row mb-3 align-items-center interest-row">

        <div class="col-md-3">

            <input
                type="date"
                name="from_date[]"
                class="form-control"
            >

        </div>

        <div class="col-md-3">

            <input
                type="date"
                name="to_date[]"
                class="form-control"
            >

        </div>

        <div class="col-md-3">

            <input
                type="text"
                name="rate[]"
                placeholder="Rate %"
                class="form-control"
            >

        </div>

        <div class="col-md-2">

            <button
                type="button"
                class="btn btn-danger"
                onclick="deleteRow(this)"
            >
                🗑 Delete
            </button>

        </div>

    </div>
    `;

    document
        .getElementById("interestRows")
        .insertAdjacentHTML(
            "beforeend",
            row
        );
}


// DELETE ROW
function deleteRow(button) {

    let rows = document.querySelectorAll(
        ".interest-row"
    );

    if (rows.length === 1) {

        alert(
            "At least one row is required."
        );

        return;
    }

    button
        .closest(".interest-row")
        .remove();
}


// CANCEL
function cancelApplication() {

    window.location.href = "/";
}

</script>

</body>
</html>
